<title>Asciifighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: one full-screen canvas; HUD panel pinned top-left, hints bottom-centre. A single night look on purpose. */
:root{
  --night:#04060a;      /* void behind the meadow */
  --hud-bg:#05070bdd;   /* HUD panel */
  --hud-line:#a9aeb8;   /* panel border, bar outline */
  --hud-text:#d9dce2;   /* HUD text */
  --hud-dim:#7d8590;    /* labels */
  --fps:#5ad06a;        /* perf readout */
  --hp:#e0303e; --mp:#7fb6ff; --xp:#ffc94a;
  --f-mono:"JetBrains Mono","DejaVu Sans Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-mono);color:var(--hud-text);touch-action:none;-webkit-user-select:none;user-select:none}
#game,#ov{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#ov{pointer-events:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45) 100%)}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));
  display:flex;gap:10px;align-items:center;padding:8px 12px 8px 8px;background:var(--hud-bg);border:1.5px solid var(--hud-line);
  font-size:12px;line-height:1.35;pointer-events:none;font-variant-numeric:tabular-nums;max-width:calc(100vw - 24px)}
#portrait{margin:0;font-size:7px;line-height:1.05;letter-spacing:0}
#portrait .s{color:#d6ecff}#portrait .w{color:#fff}#portrait .r{color:#e0303e}#portrait .k{color:#e0b48c}#portrait .d{color:#7f848c}
.stats{display:grid;gap:3px;min-width:0}
.top{white-space:nowrap}.top b{font-weight:700;margin-right:6px}.fps{color:var(--fps);font-size:11px}
.bar{display:grid;grid-template-columns:22px 120px auto;gap:6px;align-items:center;white-space:nowrap}
.bar label{color:var(--hud-dim);font-weight:700}
.track{height:9px;border:1px solid var(--hud-line);padding:1px;box-sizing:border-box}
.track i{display:block;height:100%;width:100%;transform-origin:left;
  background:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 3px)}
#hpT i{color:var(--hp)}#mpT i{color:var(--mp)}
.meta{color:var(--hud-text);white-space:nowrap}.meta span{color:var(--hud-dim)}
.xp{height:2px;background:#ffffff18}.xp i{display:block;height:100%;width:0;background:var(--xp)}
#hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;color:var(--hud-dim);
  white-space:nowrap;pointer-events:none;transition:opacity 1.2s;text-shadow:0 1px 2px #000}
#hint kbd{font-family:inherit;color:var(--hud-text);border:1px solid #ffffff30;padding:0 4px;border-radius:3px}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);font-size:22px;font-weight:700;letter-spacing:.3em;color:var(--xp);
  text-shadow:0 0 12px #ffc94a88;opacity:0;pointer-events:none;transition:opacity .4s}
#dead{position:fixed;inset:0;display:grid;place-items:center;background:#000a;text-align:center;font-size:14px;color:var(--hud-dim)}
#dead h2{font-size:28px;letter-spacing:.4em;color:var(--hp);margin:0 0 8px;font-weight:700}
#touch{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;gap:14px}
#touch button{all:unset;width:64px;height:64px;border-radius:50%;border:1.5px solid var(--hud-line);background:#05070bb0;color:var(--hud-text);
  font-size:11px;font-weight:700;text-align:center;letter-spacing:.08em}
#stick{position:fixed;width:90px;height:90px;border-radius:50%;border:1px solid #ffffff30;pointer-events:none;transform:translate(-50%,-50%)}
#stick i{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#ffffff30}
@media (max-width:520px){#hud{font-size:11px}.bar{grid-template-columns:20px 84px auto}#portrait{display:none}#hint{font-size:10px}}
@media (prefers-reduced-motion:reduce){#hint,#toast{transition:none}}
</style>

<canvas id="game" aria-label="Asciifighter: a top-down sword fighting game drawn with text characters"></canvas>
<canvas id="ov" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div id="hud">
  <pre id="portrait" aria-hidden="true"><span class="s">  .</span><span class="w">^</span><span class="s">.</span>
<span class="s"> (</span><span class="d">o</span><span class="k">_</span><span class="d">o</span><span class="s">)</span>
<span class="s">/|</span><span class="w">[</span><span class="r">#</span><span class="w">]</span><span class="s">|\</span>
<span class="s"> '</span><span class="w">[</span><span class="r">#</span><span class="w">]</span><span class="s">'</span>
<span class="d">  / \</span></pre>
  <div class="stats">
    <div class="top"><b>Ren</b><span class="fps">FPS <span id="fps">--</span> · frame <span id="ms">--</span> ms</span></div>
    <div class="bar"><label>HP</label><div class="track" id="hpT"><i></i></div><span id="hpV">--</span></div>
    <div class="bar"><label>MP</label><div class="track" id="mpT"><i></i></div><span id="mpV">--</span></div>
    <div class="meta">LV <b id="lv">1</b> <span>·</span> <b id="gold">0</b>g <span>·</span> <b id="kills">0</b> <span>slain</span></div>
    <div class="xp"><i id="xp"></i></div>
  </div>
</div>
<div id="hint"><kbd>WASD</kbd> move · <kbd>mouse</kbd> aim · <kbd>click</kbd>/<kbd>space</kbd> slash · <kbd>shift</kbd> dash</div>
<div id="toast">LEVEL UP</div>
<div id="dead" hidden><div><h2>YOU FELL</h2>press <b>R</b> or tap to rise again</div></div>
<div id="touch" hidden><button type="button" id="bDash">DASH</button><button type="button" id="bSlash">SLASH</button></div>
<div id="stick" hidden><i></i></div>

<script>
(()=>{
/* ================= constants & palette ================= */
const CW=6,CH=10,ASP=CH/CW;
const PAL=["#235a2e","#2f8a3c","#55b04f","#a2e07c","#3fb8ae","#8fe0ff","#3a2e24","#6b5642","#7f848c","#c4c8ce","#454951",
 "#ece6d4","#9c9584","#d4283c","#7a1424","#d6ecff","#ffffff","#ffc94a","#173f63","#4c9ccc","#14301a","#356c34","#e0b48c","#ff3a3a","#aab0ba","#64763a"];
const G0=0,G1=1,G2=2,G3=3,TEAL=4,BLUE=5,SOIL=6,SOILL=7,STONE=8,STONEL=9,STONED=10,BONE=11,BONED=12,RED=13,REDD=14,STEEL=15,WHITE=16,GOLD=17,
 WATER=18,WATERL=19,LEAF=20,LEAFL=21,SKIN=22,EYE=23,UI=24,MOSS=25;
const NC=PAL.length;
const glyphOf=c=>c===1?"·":c===2?"•":String.fromCharCode(c);
const code=s=>s==="·"?1:s==="•"?2:s.charCodeAt(0);
const C_SL=47,C_BS=92,C_PI=124,C_L=108,C_AP=39,C_CM=44,C_DT=46,C_CO=58,C_TI=126,C_DA=45;

/* ================= noise ================= */
function h1(i,s){let x=Math.imul((i|0)^Math.imul(s|0,374761393),668265263);x=Math.imul(x^(x>>>13),1274126177);return((x^(x>>>16))>>>0)/4294967296}
function h2(x,y,s){return h1(Math.imul(x|0,73856093)^Math.imul(y|0,19349663),s)}
function vn2(x,y,s){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
 const a=h2(ix,iy,s),b=h2(ix+1,iy,s),c=h2(ix,iy+1,s),d=h2(ix+1,iy+1,s);return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy}
function fbm2(x,y,s,o=4){let a=0,m=.5,f=1,n=0;for(let k=0;k<o;k++){a+=m*vn2(x*f,y*f,s+k*101);n+=m;m*=.5;f*=2.03}return a/n}
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
let seed=1337;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};

/* ================= renderer: WebGL2 instanced glyphs, canvas-2D fallback ================= */
const cv=document.getElementById("game"),ov=document.getElementById("ov"),octx=ov.getContext("2d");
let DPR=1,VW=0,VH=0,TW=0,TH=0,OX=0,OY=0;
const PRGB=PAL.map(h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]});
const hexRGB=h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]};
const GLOW_F=hexRGB("#6fd8ff"),GLOW_G=hexRGB("#ffc94a"),GLOW_R=hexRGB("#ff3030"),GLOW_S=hexRGB("#bfe8ff");
const FONT=()=>`${Math.round(10*DPR)}px "JetBrains Mono","DejaVu Sans Mono",monospace`;
let gl=null;try{gl=cv.getContext("webgl2",{antialias:false,alpha:false,premultipliedAlpha:true,powerPreference:"high-performance"})}catch(_){}
const ctx=gl?null:cv.getContext("2d",{alpha:false});
let camX=0,camY=0;
const R=gl?makeGL():make2D();
function put(dx,dy,c,col,a){R.put(dx,dy,c,col,a)}
function stamp(wx,wy,c,col,a){R.put(Math.round((wx-camX)*DPR-TW/2),Math.round((wy-camY)*DPR-TH/2),c,col,a)}
function drawGlow(wx,wy,r,rgb,a){R.glow((wx-camX)*DPR,(wy-camY)*DPR,r*DPR,rgb,a)}
function glyphCanvas(){ // white glyph atlas + soft glow disc
 const codes=[1,2];for(let c=32;c<127;c++)codes.push(c);const pad=2,cw=TW+pad,ch=TH+pad,per=Math.floor(1024/cw);
 const a=document.createElement("canvas");a.width=1024;a.height=Math.ceil(codes.length/per)*ch+70;const x=a.getContext("2d");
 x.font=FONT();x.textAlign="center";x.textBaseline="middle";x.fillStyle="#fff";const pos={};
 codes.forEach((c,i)=>{const sx=(i%per)*cw+1,sy=Math.floor(i/per)*ch+1;x.fillText(glyphOf(c),sx+TW/2,sy+TH/2+DPR*.5);pos[c]=[sx,sy]});
 const gy=a.height-66;const gr=x.createRadialGradient(33,gy+32,0,33,gy+32,32);gr.addColorStop(0,"rgba(255,255,255,.85)");gr.addColorStop(.25,"rgba(255,255,255,.35)");gr.addColorStop(1,"rgba(255,255,255,0)");
 x.fillStyle=gr;x.fillRect(1,gy,64,64);return{a,pos,glow:[1,gy,64,64]};
}
function makeGL(){
 const vs=`#version 300 es
 layout(location=0) in vec2 q;layout(location=1) in vec4 r;layout(location=2) in vec4 uv;layout(location=3) in vec4 c;
 uniform vec2 res;out vec2 vuv;out vec4 vc;
 void main(){vec2 p=r.xy+q*r.zw;vuv=mix(uv.xy,uv.zw,q);vc=c;vec2 n=p/res*2.0-1.0;gl_Position=vec4(n.x,-n.y,0.0,1.0);}`;
 const fs=`#version 300 es
 precision mediump float;in vec2 vuv;in vec4 vc;uniform sampler2D t;out vec4 o;
 void main(){float a=texture(t,vuv).a*vc.a;o=vec4(vc.rgb*a,a);}`;
 const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
 const uRes=gl.getUniformLocation(pr,"res");
 const vao=gl.createVertexArray();gl.bindVertexArray(vao);
 const qb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,qb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
 const MAX=80000,I=new Float32Array(MAX*12),A=new Float32Array(6000*12);let ni=0,na=0;
 const ib=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,ib);gl.bufferData(gl.ARRAY_BUFFER,I.byteLength,gl.DYNAMIC_DRAW);
 [[1,0],[2,16],[3,32]].forEach(([l,o])=>{gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,4,gl.FLOAT,false,48,o);gl.vertexAttribDivisor(l,1)});
 const tex=gl.createTexture();let UV=new Float32Array(160*4),GUV=[0,0,0,0];
 gl.enable(gl.BLEND);
 return{
  rebuild(){const g=glyphCanvas();gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,g.a);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
   gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
   const W=g.a.width,H=g.a.height;UV.fill(0);for(const c in g.pos){const[x,y]=g.pos[c];UV[c*4]=x/W;UV[c*4+1]=y/H;UV[c*4+2]=(x+TW)/W;UV[c*4+3]=(y+TH)/H}
   const[gx,gy,gw,gh]=g.glow;GUV=[gx/W,gy/H,(gx+gw)/W,(gy+gh)/H];gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(uRes,cv.width,cv.height)},
  begin(){ni=0;na=0;gl.clearColor(.016,.024,.04,1);gl.clear(gl.COLOR_BUFFER_BIT)},
  put(dx,dy,c,col,a){if(a<.03||ni>=MAX)return;if(a>1)a=1;const o=ni*12,u=c*4,k=PRGB[col];
   I[o]=dx;I[o+1]=dy;I[o+2]=TW;I[o+3]=TH;I[o+4]=UV[u];I[o+5]=UV[u+1];I[o+6]=UV[u+2];I[o+7]=UV[u+3];I[o+8]=k[0];I[o+9]=k[1];I[o+10]=k[2];I[o+11]=a;ni++},
  glow(x,y,r,k,a){if(a<.02||na>=6000)return;const o=na*12,s=r*2;A[o]=x-r;A[o+1]=y-r;A[o+2]=s;A[o+3]=s;A[o+4]=GUV[0];A[o+5]=GUV[1];A[o+6]=GUV[2];A[o+7]=GUV[3];
   A[o+8]=k[0];A[o+9]=k[1];A[o+10]=k[2];A[o+11]=a>1?1:a;na++},
  end(){gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,ib);
   gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.bufferSubData(gl.ARRAY_BUFFER,0,I,0,ni*12);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,ni);
   if(na){gl.blendFunc(gl.ONE,gl.ONE);gl.bufferSubData(gl.ARRAY_BUFFER,0,A,0,na*12);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,na)}},
  count:()=>ni};
}
function make2D(){
 const atlas=document.createElement("canvas"),ax=atlas.getContext("2d");const NC=PAL.length;
 const TILE=new Int32Array(160*NC);const TSX=new Float32Array(20000),TSY=new Float32Array(20000);let n=0,cols=1,cap=1;const glows=[];let gimg=null,gr=null;
 function reset(){atlas.width=2048;atlas.height=2048;cols=Math.floor(2048/TW);cap=cols*Math.floor(2048/TH);ax.font=FONT();ax.textAlign="center";ax.textBaseline="middle";TILE.fill(-1);n=0}
 function tile(c,col){const k=c*NC+col;let t=TILE[k];if(t>=0)return t;if(n>=cap)reset();t=n++;const sx=(t%cols)*TW,sy=Math.floor(t/cols)*TH;
  ax.fillStyle=PAL[col];ax.fillText(glyphOf(c),sx+TW/2,sy+TH/2+DPR*.5);TSX[t]=sx;TSY[t]=sy;TILE[k]=t;return t}
 return{
  rebuild(){reset();const g=glyphCanvas();gimg=g.a;gr=g.glow},
  begin(){glows.length=0;ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";ctx.fillStyle="#04060a";ctx.fillRect(0,0,cv.width,cv.height)},
  put(dx,dy,c,col,a){if(a<.03)return;const t=tile(c,col);ctx.globalAlpha=a>1?1:a;ctx.drawImage(atlas,TSX[t],TSY[t],TW,TH,dx,dy,TW,TH)},
  glow(x,y,r,k,a){glows.push(x,y,r,a)},
  end(){ctx.globalCompositeOperation="lighter";for(let i=0;i<glows.length;i+=4){ctx.globalAlpha=Math.min(1,glows[i+3]);const r=glows[i+2];ctx.drawImage(gimg,gr[0],gr[1],gr[2],gr[3],glows[i]-r,glows[i+1]-r,r*2,r*2)}
   ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1},
  count:()=>0};
}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;
 for(const c of[cv,ov]){c.width=Math.round(VW*DPR);c.height=Math.round(VH*DPR)}
 TW=Math.ceil(CW*DPR)+2;TH=Math.ceil(CH*1.4*DPR);OX=1;OY=Math.round((TH-CH*DPR)/2);R.rebuild()}

/* ================= world generation ================= */
const WC=440,HC=270,WPX=WC*CW,WPY=HC*CH;
const T_GROUND=0,T_GRASS=1,T_PATH=2,T_WATER=3,T_STONE=4,T_PLAZA=5,T_FLOWER=6;
const T=new Uint8Array(WC*HC),VAR=new Float32Array(WC*HC),SG=new Uint8Array(WC*HC),SC=new Uint8Array(WC*HC),SA=new Float32Array(WC*HC),
 SH=new Float32Array(WC*HC).fill(1),CG=new Uint8Array(WC*HC),CC=new Uint8Array(WC*HC),CA=new Float32Array(WC*HC),TR=new Float32Array(WC*HC);
const colliders=[];
const LIGHT=[-.55,-.62,.56];
const STONE_RAMP=" .:-=+*cxoO0QNWM@";
const LEAF_RAMP=" .,:;+*%#&@";
function pathY(px){return WPY*.5+260*Math.sin(px*.0023+.4)+110*Math.sin(px*.0071+1.3)}
function genWorld(){
 seed=20261109;
 const sites=[{x:WPX*.5,y:WPY*.5,R:150,ring:9},{x:WPX*.2,y:WPY*.24,R:110,ring:7},{x:WPX*.8,y:WPY*.78,R:130,ring:8},{x:WPX*.18,y:WPY*.8,R:95,ring:6}];
 const pond={x:WPX*.72,y:WPY*.28,R:190};
 for(let y=0;y<HC;y++)for(let x=0;x<WC;x++){
  const i=y*WC+x,px=x*CW+CW/2,py=y*CH+CH/2,v=h2(x,y,7);VAR[i]=v;
  const d=fbm2(px*.0032,py*.0032,3,4);
  let t=T_GROUND;
  if(d>.36){const p=clamp((d-.36)/.2,0,1);if(v<.5+.48*p)t=T_GRASS}
  if(t===T_GRASS&&h2(x,y,99)<.022)t=T_FLOWER;
  const pd=Math.abs(py-pathY(px))+fbm2(px*.02,py*.02,5,2)*14;if(pd<20&&v<(pd<12?.92:.55))t=T_PATH;
  const wd=Math.hypot(px-pond.x,(py-pond.y)*1.25)/(pond.R*(.75+.45*fbm2(px*.006,py*.006,8,3)));if(wd<1)t=T_WATER;
  for(const s of sites){const sd=Math.hypot(px-s.x,py-s.y);if(sd<s.R){const n=fbm2(px*.03,py*.03,4,3);
   if(n<.62||sd<s.R*.5){t=T_PLAZA;const tile=((Math.floor(px/26)+Math.floor(py/20))&1);const edge=(px%26<4)||(py%20<3);
    SG[i]=edge?C_DT:(n>.55?C_CO:(h2(x,y,3)>.75?C_DT:32));SC[i]=edge?STONED:(tile?STONE:STONED);SA[i]=edge?.55:.35}}}
  T[i]=t;
 }
 // standing stones + altar per site
 const blob=(cx,cy,rx,ry,kind)=>{
  for(let y=Math.floor((cy-ry*1.8)/CH);y<=(cy+ry*1.8)/CH;y++)for(let x=Math.floor((cx-rx*1.8)/CW);x<=(cx+rx*1.8)/CW;x++){
   if(x<0||y<0||x>=WC||y>=HC)continue;const i=y*WC+x,px=x*CW+CW/2,py=y*CH+CH/2;
   const n=fbm2(px*.08,py*.08,kind==="leaf"?17:11,3);
   const dx=(px-cx)/rx,dy=(py-cy)/ry;const dd=Math.hypot(dx,dy)/(.82+.36*n);
   if(dd<1){const nz=Math.sqrt(Math.max(0,1-dd*dd));const nx=dx/(.82+.36*n)*.9,ny=dy/(.82+.36*n)*.9;
    let b=clamp((nx*LIGHT[0]+ny*LIGHT[1]+nz*LIGHT[2])*.85+.15+(n-.5)*.5,0,1);
    if(kind==="leaf"){const cl=fbm2(px*.15,py*.15,23,2);b=clamp(b*.8+cl*.35-.1,0,1);
     CG[i]=code(LEAF_RAMP[Math.max(1,Math.floor(b*(LEAF_RAMP.length-1)))]);CC[i]=b>.78?G3:b>.55?LEAFL:b>.3?G0:LEAF;CA[i]=.55+b*.45;}
    else{T[i]=T_STONE;const moss=fbm2(px*.12,py*.12,31,2)>.66;

    if(ty===T_FLOWER){put(dx,dy,v>.5?C_DT:1,TB[k]>.2?WHITE:BLUE,(.55+TB[k])*light);continue}
    let g,col;
    if(tr>.4){g=v>.5?C_CM:C_DT;col=G0;put(dx,dy,g,col,.5*light);continue}
    if(v>.9)g=v>.95?C_AP:C_CM;else g=lean>.32?C_SL:lean<-.32?C_BS:(v<.18?C_L:C_PI);
    col=v<.3?G0:v<.66?G1:v<.88?G2:G3;
    if(TB[k]>.28)col=TEAL;else if(light>1.22&&col<G3)col++;
    put(dx,dy,g,col,(.42+.58*v)*light);
   }else if(ty===T_GROUND){
    if(v<.16)put(dx,dy,v<.05?C_CM:C_DT,v<.08?G0:SOILL,.45*light);
    if(TB[k]>.3&&v>.8)put(dx,dy,C_DT,TEAL,TB[k]*.5);
   }else if(ty===T_PATH){
    if(v<.5)put(dx,dy,v<.15?C_CO:v<.3?C_CM:C_DT,v<.25?SOILL:SOIL,.65*light);
   }else if(ty===T_WATER){
    const w=Math.sin(t*1.1+px*.045+py*.02+v*5)+.6*Math.sin(t*.7-px*.02+py*.05);
    if(w>1.1)put(dx,dy,C_TI,WATERL,.65*light);else if(w>.4)put(dx,dy,v>.5?C_TI:C_DA,WATER,.6*light);else if(v<.12)put(dx,dy,C_DT,WATER,.5*light);
    if(TB[k]>.3)put(dx,dy,C_TI,TEAL,TB[k]*.5);
   }else{ // stone / plaza
    if(SG[i]>32)put(dx,dy,SG[i],TB[k]>.4&&SC[i]!==MOSS?TEAL:SC[i],SA[i]*light);
   }
  }}
 // ---- entities, y-sorted
 const ents=[];for(const s of skels)ents.push({y:s.y,f:()=>drawSkel(s)});for(const c of coins)ents.push({y:c.y,f:()=>drawCoin(c)});
 if(!P.dead)ents.push({y:P.y,f:()=>drawPlayer()});
 ents.sort((a,b)=>a.y-b.y);for(const e of ents)e.f();
 // particles
 for(const p of parts){const a=clamp(p.life/Math.min(p.max,1.2),0,1);stamp(p.x,p.y-p.z,p.c,p.col,a)}
 // canopy overlay
 for(let r=0;r<rows;r++){const wy=r0+r;if(wy<0||wy>=HC)continue;const dy=Math.round((wy*CH-camY)*DPR)-OY;const py=wy*CH+CH/2;
  for(let c=0;c<cols;c++){const wx=c0+c;if(wx<0||wx>=WC)continue;const i=wy*WC+wx;if(!CG[i])continue;const k=r*cols+c;
   const px=wx*CW+CW/2;let a=CA[i]*(.9+LB[k]*.8);const dpx=px-P.x,dpy=(py-P.y+14)*1.3;const dd=dpx*dpx+dpy*dpy;if(dd<2500)a*=.25+.75*Math.sqrt(dd)/50;
   let col=CC[i];if(VAR[i]>.8&&Math.sin(t*2.1+px*.03+py*.02)>.55)col=G3;if(TB[k]>.35)col=TEAL;
   put(Math.round((wx*CW-camX)*DPR)-OX,dy,CG[i],col,a)}}
 // glows (additive)
 for(const f of flies){const b=.5+.5*Math.sin(now*2.2+f.b);drawGlow(f.x,f.y,20,GLOW_F,.55*b);stamp(f.x,f.y,b>.5?2:1,b>.7?WHITE:BLUE,.5+.5*b)}
 for(const c of coins)drawGlow(c.x,c.y-c.z,16,GLOW_G,.35);
 for(const s of skels)if(s.state==="wind")drawGlow(s.x,s.y-34,22,GLOW_R,.6+.4*Math.sin(now*30));
 if(P.swing>0)drawGlow(P.x+Math.cos(P.bladeA)*26,P.y-16+Math.sin(P.bladeA)*18,40,GLOW_S,.35);
 R.end();
 const ctx=octx;
 // labels & numbers
 ctx.globalAlpha=1;ctx.textAlign="center";ctx.textBaseline="middle";
 if(!P.dead){ctx.font=`${Math.round(10*DPR)}px "JetBrains Mono",monospace`;ctx.fillStyle="#cfd3da";ctx.globalAlpha=.85;ctx.fillText("Ren",(P.x-camX)*DPR,(P.y-62-camY)*DPR)}
 for(const s of skels)if(s.hp<s.hpMax&&s.state!=="rise"){const w=26*DPR,x=(s.x-camX)*DPR-w/2,y=(s.y-52-camY)*DPR;ctx.globalAlpha=.8;ctx.fillStyle="#000";ctx.fillRect(x-1,y-1,w+2,3*DPR+2);ctx.fillStyle="#d4283c";ctx.fillRect(x,y,w*clamp(s.hp/s.hpMax,0,1),3*DPR)}
 for(const nm of nums){const k=nm.t/1.1;ctx.globalAlpha=1-k*k;ctx.font=`700 ${Math.round((nm.big?17:12)*DPR*(nm.t<.08?1.4:1))}px "JetBrains Mono",monospace`;
  const x=(nm.x-camX)*DPR,y=(nm.y-camY-nm.t*34)*DPR;ctx.lineWidth=3*DPR;ctx.strokeStyle="#000";ctx.strokeText(nm.txt,x,y);ctx.fillStyle=nm.col;ctx.fillText(nm.txt,x,y)}
 ctx.globalAlpha=1;
 if(P.hurt>0){ctx.fillStyle=`rgba(200,20,30,${P.hurt*.5})`;ctx.fillRect(0,0,ov.width,ov.height)}
 camX=realCam[0];camY=realCam[1];
}
/* ---- sprites ---- */
function art(rows,masks,map){const out=[];const h=rows.length,w=Math.max(...rows.map(r=>r.length));
 rows.forEach((row,r)=>{for(let c=0;c<row.length;c++){if(row[c]===" ")continue;out.push({dx:(c-(w-1)/2)*CW,dy:(r-h+.5)*CH,c:code(row[c]),col:map[masks[r][c]]})}});return out}
const PMAP={s:STEEL,w:WHITE,k:SKIN,e:STONED,r:RED,d:STONE};
const P_DOWN=art(["  .^.  "," (o_o) ","/|[#]|\\"," '[#]' "],["  sws  "," sekes ","sswrwss"," swrws "],PMAP);
const P_UP=art(["  .^.  "," (   ) ","/|[#]|\\"," '[#]' "],["  sws  "," s   s ","sswrwss"," swrws "],PMAP);
const P_RIGHT=art(["  .^.  ","  (o>  "," /[#]\\ ","  [#]  "],["  sws  ","  sek  "," swrws ","  wrw  "],PMAP);
const P_LEFT=art(["  .^.  ","  <o)  "," /[#]\\ ","  [#]  "],["  sws  ","  kes  "," swrws ","  wrw  "],PMAP);
const LEGS=[art(["  / \\  "],["  d d  "],PMAP),art(["  | \\  "],["  d d  "],PMAP),art(["  / |  "],["  d d  "],PMAP)];
const SMAP={b:BONE,B:BONED,x:EYE,d:STONED};
const S_BODY=art([" .-. ","(o o)"," )=( ","/|=|\\"],[" bbb ","bx xb"," BbB ","bBbBb"],SMAP);
const S_LEGS=[art([" / \\ "],[" B B "],SMAP),art([" | \\ "],[" B B "],SMAP),art([" / | "],[" B B "],SMAP)];
function drawArt(a,x,y,alpha,tint,flash){for(const g of a)stamp(x+g.dx,y+g.dy,g.c,flash?WHITE:tint!=null?tint:g.col,alpha)}
function bodyArt(face){const c=Math.cos(face),s=Math.sin(face);if(Math.abs(c)>Math.abs(s)*1.2)return c>0?P_RIGHT:P_LEFT;return s>0?P_DOWN:P_UP}
function bladeChar(a){const d=((-a*180/Math.PI)%180+180)%180;return d<22||d>158?C_DA:d<68?C_SL:d<112?C_PI:C_BS}
function drawCape(alpha,tint){const cp=P.cape;for(let i=1;i<cp.length;i++){const p=cp[i],q=cp[i-1];const ang=Math.atan2(p.y-q.y,p.x-q.x);const nx=-Math.sin(ang),ny=Math.cos(ang);
 const w=4+i*2.5;for(let j=-w;j<=w;j+=CW*.9){const e=Math.abs(j)/w;stamp(p.x+nx*j,p.y+ny*j*.6,code(e>.7?"%":i%2?"#":"&"),tint!=null?tint:(e>.7||i>cp.length-2?REDD:RED),alpha*(1-e*.3))}}}
function drawPlayer(){
 for(const g of P.ghosts){const a=(1-g.t/.3)*.45;drawArt(bodyArt(g.face),g.x,g.y-6,a,TEAL);drawArt(LEGS[0],g.x,g.y+4,a,TEAL)}
 const up=Math.sin(P.face)<-.4;const f=P.hurt>0&&Math.floor(now*30)%2===0;
 if(!up)drawCape(1);
 const moving=Math.hypot(P.vx,P.vy)>25;const leg=moving?LEGS[1+(Math.floor(P.walk)%2)]:LEGS[0];const bob=moving?Math.abs(Math.sin(P.walk*Math.PI))*-1.5:0;
 drawArt(leg,P.x,P.y+4,1);drawArt(bodyArt(P.face),P.x,P.y-6+bob,1,null,f);
 if(up)drawCape(1);
 // sword
 const hx=P.x+Math.cos(P.bladeA)*7,hy=P.y-16+Math.sin(P.bladeA)*5;const bc=bladeChar(P.bladeA);
 for(let k=0;k<6;k++){const r=6+k*4.6;stamp(hx+Math.cos(P.bladeA)*r,hy+Math.sin(P.bladeA)*r*.7,k===5?C_AP:bc,k>3?WHITE:STEEL,1)}
 // slash trail
 if(P.trail&&P.trail.length>1&&now-P.trail[P.trail.length-1].t<.25){const tr=P.trail;const A0=tr[0].a,A1=tr[tr.length-1].a;const n=22;
  for(let i=0;i<=n;i++){const u=i/n,a=A0+(A1-A0)*u;const age=1-u;for(let L=0;L<3;L++){const r=22+L*7;
   const tx=-Math.sin(a),ty=Math.cos(a);stamp(P.x+Math.cos(a)*r,P.y-14+Math.sin(a)*r*.7,bladeChar(Math.atan2(ty,tx)),u>.75?WHITE:u>.4?STEEL:TEAL,(u*u)*(1-L*.22)*(P.swing>0?1:.5))}}}
}
function drawSkel(s){
 const rise=s.state==="rise"?s.rise:1;const yOff=(1-rise)*30;
 if(rise<1){for(let i=0;i<4;i++)stamp(s.x+(i-1.5)*CW,s.y+4,C_DT,SOILL,.8)}
 const moving=Math.hypot(s.vx,s.vy)>15;const leg=moving?S_LEGS[1+(Math.floor(s.walk)%2)]:S_LEGS[0];
 const lunge=s.state==="strike"?6:s.state==="wind"?-3:0;const lx=Math.cos(s.face)*lunge,ly=Math.sin(s.face)*lunge*.6;
 const fl=s.flash>0;
 const clip=(a)=>a.filter(g=>g.dy+yOff<=10);
 drawArt(clip(leg),s.x+lx,s.y+4+yOff,rise);drawArt(clip(S_BODY),s.x+lx,s.y-6+yOff,rise,null,fl);
 if(rise>=1){const a=s.face+(s.state==="wind"?-1.4:s.state==="strike"?.6:.3);const hx=s.x+lx+Math.cos(a)*9,hy=s.y-14+ly+Math.sin(a)*6;const bc=bladeChar(a);
  for(let k=0;k<4;k++)stamp(hx+Math.cos(a)*(5+k*4.4),hy+Math.sin(a)*(5+k*4.4)*.7,bc,k===3?STONE:BONED,1);
  if(s.state==="wind")stamp(s.x,s.y-48,code("!"),EYE,.6+.4*Math.sin(now*30))}
}
function drawCoin(c){const b=Math.sin(now*6+c.x)*.5+.5;stamp(c.x,c.y-c.z-4,code(b>.5?"$":"s"),GOLD,1);stamp(c.x,c.y+2,C_DT,STONED,.5)}

const $=id=>document.getElementById(id);const hpI=$("hpT").firstChild,mpI=$("mpT").firstChild;let fpsN=0,fpsT=0,msAcc=0;
function hud(){hpI.style.transform=`scaleX(${P.hp/P.hpMax})`;mpI.style.transform=`scaleX(${P.mp/P.mpMax})`;
 $("hpV").textContent=`${Math.ceil(P.hp)}/${P.hpMax}`;$("mpV").textContent=`${Math.floor(P.mp)}/${P.mpMax}`;$("lv").textContent=P.lv;$("gold").textContent=P.gold;$("kills").textContent=P.kills;
 $("xp").style.width=(P.xp/xpNeed(P.lv)*100)+"%"}

/* ================= loop ================= */
let last=performance.now();
function frame(ts){const t0=performance.now();let dt=Math.min(.05,(ts-last)/1000);last=ts;frameN++;
 if(hitStop>0){hitStop-=dt;dt*=.1}
 now+=dt;update(dt);render();
 msAcc+=performance.now()-t0;fpsN++;if(ts-fpsT>500){$("fps").textContent=Math.round(fpsN*1000/(ts-fpsT));$("ms").textContent=(msAcc/fpsN).toFixed(1);fpsN=0;msAcc=0;fpsT=ts;hud()}
 if(frameN%6===0)hud();
 requestAnimationFrame(frame)}
function start(){resize();genWorld();camX=clamp(P.x-VW/2,0,WPX-VW);camY=clamp(P.y-VH/2,0,WPY-VH);for(let i=0;i<4;i++)spawnSkel();
 for(const f of flies){f.x=camX+rnd()*VW;f.y=camY+rnd()*VH}
 addEventListener("resize",resize);requestAnimationFrame(t=>{last=t;fpsT=t;requestAnimationFrame(frame)})}
window.__game={P,skels,get cam(){return[camX,camY]},get glyphs(){return R.count()},gl:!!gl};
(document.fonts&&document.fonts.load?Promise.race([document.fonts.load('10px "JetBrains Mono"'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(start,start);
})();
